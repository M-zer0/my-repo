name: SendPullRequestMessage
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  comment_opening_announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '? Thanks for reporting!'
            })
  send_pullreq_message:
    runs-on: ubuntu-latest
    steps:
    - name: checkAssignee
      run: | 
        echo ${{ github.event.pull_request.title}}
        echo ${{ github.event.pull_request.Assignees[0]}}
        echo ${{ github.event.pull_request.Assignees[0].login}}
        echo ${{ github.event.pull_request.Assignees[1].login}}
        echo ${{ github.event.pull_request.Assignees.number}}
        echo ${{ secrets.GITHUB_TOKEN }}
    - name: Send GitHub trigger payload to Slack Workflow Builder
      id: slack
      if: github.event.pull_request.assignees[0].login == 'n-subAccount'
      uses: slackapi/slack-github-action@v2.0.0
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK }}
        webhook-type: webhook-trigger
        payload: "{\"text\":\" <@U07MJKPLW9Z> <!here>\\n 以下のプルリクエストを作成しました。\\n
          Title     : ${{ github.event.pull_request.title}}\\n 
          URL       : ${{ github.event.pull_request.html_url}}\\n
          Assignees : ${{ github.event.pull_request.assignees[0].login}}\\n
          Revwer    : ${{ github.event.pull_request.requested_reviewers[0].login}}\"}"
  send_pullreq_message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm install @slack/webhook
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '? Thanks for reporting!'
            })

            const MEMBER_INFO = [
              {slackName: "n-miyazawa", slackMemberId: "U07MJKPLW9Z", githubName: "M-zer0"}
            ]
            const requestUser = context.payload.sender.login
          
            const approver = MEMBER_INFO[0]
            const message = "<@${approver.slackMemberId}> こんにちは"
            const webhook = new IncomingWebhook('https://miyazawalocal.slack.com/archives/C07MM7UDN6Q')
          
            webhook.send({
              text: message,
            });
